name: Rebuild Bowtie Image

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - "wip*"

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Check Harness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build dotnet-lateapexearlyspeed-jsonschema.csproj --configuration Release
      - name: Test fixtures
        shell: pwsh
        run: ./test-fixtures.ps1

  ci:
    name: Build and Smoke Test Image
    needs: check
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write
      artifact-metadata: write
    uses: bowtie-json-schema/bowtie/.github/workflows/harness-ci.yml@94e106ed72e2f75700ec19b7927c46cf8417fb8a
    with:
      publish: ${{ github.repository == 'bowtie-json-schema/dotnet-lateapexearlyspeed-jsonschema' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      is-latest: ${{ github.ref == 'refs/heads/main' }}
      qemu: false

  automerge:
    name: Automerge Dependabot PRs
    needs: ci
    runs-on: ubuntu-latest
    if: >
      github.repository == 'bowtie-json-schema/dotnet-lateapexearlyspeed-jsonschema'
      && github.event_name == 'pull_request'
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && !contains(github.event.pull_request.labels.*.name, 'github_actions')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Automatically merge allowed PRs
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
